name: Deploy via SSH

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host jump
              HostName ${{ secrets.JUMP_HOST }}
              User ${{ secrets.JUMP_USER }}

            Host target
              HostName ${{ secrets.TARGET_HOST }}
              User ${{ secrets.TARGET_USER }}
              ProxyJump jump

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: target
          REMOTE_USER: ${{ secrets.TARGET_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: ".git, .github, node_modules, .env"

      - name: Restart application
        run: |
          ssh target "cd ${{ secrets.DEPLOY_PATH }} && pm2 restart 99cents || pm2 start npm --name 99cents -- start"

      - name: Clear Cloudflare cache
        uses: Cyb3r-Jak3/action-cloudflare-cache@main
        with:
          zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy 99cents.one completed!

            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}
