name: Deploy via SSH

on:
  workflow_dispatch:  # Manual deploy only

  jobs:
    deploy:
      runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    - name: Install SSH key of bastion 🔑
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_BASTION }}
          name: id_rsa_bastion
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host bastion
              HostName ${{ secrets.JUMP_HOST }}
              User ${{ secrets.JUMP_USER }}
              IdentityFile ~/.ssh/id_rsa_bastion

      - name: Install SSH key of target 🔑
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_TARGET }}
          name: id_rsa_target
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host target
              HostName ${{ secrets.TARGET_HOST }}
              User ${{ secrets.TARGET_USER }}
              IdentityFile ~/.ssh/id_rsa_target
              ProxyCommand ssh -W %h:%p bastion

      - name: Deploy to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh" \
            ./ target:${{ secrets.DEPLOY_PATH }}

      - name: Restart application
        run: |
          ssh target "cd ${{ secrets.DEPLOY_PATH }} && pm2 restart 99cents || pm2 start npm --name 99cents -- start"

      - name: Clear Cloudflare cache
        uses: Cyb3r-Jak3/action-cloudflare-cache@main
        with:
          zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy 99cents.one completed!

            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}
