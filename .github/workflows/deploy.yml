name: Deploy via SSH

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key for Bastion
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_BASTION }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          name: id_rsa_bastion

      - name: Setup SSH key for Target
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_TARGET }}
          known_hosts: unnecessary
          name: id_rsa_target
          if_key_exists: ignore

      - name: Configure SSH
        run: |
          cat >> ~/.ssh/config << EOF
          Host jump
            HostName ${{ secrets.JUMP_HOST }}
            User ${{ secrets.JUMP_USER }}
            IdentityFile ~/.ssh/id_rsa_bastion

          Host target
            HostName ${{ secrets.TARGET_HOST }}
            User ${{ secrets.TARGET_USER }}
            IdentityFile ~/.ssh/id_rsa_target
            ProxyJump jump
          EOF

      - name: Deploy to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh" \
            ./ target:${{ secrets.DEPLOY_PATH }}

      - name: Restart application
        run: |
          ssh target "cd ${{ secrets.DEPLOY_PATH }} && pm2 restart 99cents || pm2 start npm --name 99cents -- start"

      - name: Clear Cloudflare cache
        uses: Cyb3r-Jak3/action-cloudflare-cache@main
        with:
          zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy 99cents.one completed!

            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}
